<!doctype html>
<html>
<head>
  <meta charset="utf-8"/>
  <title>The Traffic Stop</title>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.js"></script>
  <style>
    html, body, #renderCanvas { width:100%; height:100%; margin:0; padding:0; overflow:hidden; background:#0a0a12; }
    #ui {
      position:absolute; bottom:0; left:0; right:0;
      padding:20px 32px 28px;
      background:linear-gradient(transparent, rgba(0,0,0,.75));
      font-family:Georgia, serif; color:#fff; pointer-events:none;
    }
    #speaker { font-size:13px; letter-spacing:.12em; text-transform:uppercase; opacity:.6; margin-bottom:6px; }
    #line    { font-size:17px; line-height:1.5; max-width:640px; margin:0 auto; text-align:center;
               text-shadow:0 1px 6px rgba(0,0,0,.8); min-height:1.5em; }
    #prog-bg { height:2px; background:rgba(255,255,255,.15); border-radius:1px; margin-top:14px; }
    #prog-bar{ height:100%; background:rgba(180,200,255,.7); border-radius:1px; width:0%; transition:width .1s linear; }
    #loading { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
               font:14px monospace; color:rgba(255,255,255,.5); background:#0a0a12; }
  </style>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <div id="ui">
    <div id="speaker"></div>
    <div id="line">Loading&hellip;</div>
    <div id="prog-bg"><div id="prog-bar"></div></div>
  </div>
  <div id="loading">Loading scene&hellip;</div>
  <div id="diagnostics" style="position:absolute; top:10px; left:10px; padding:10px; background:rgba(0,0,0,0.6); color:#0f0; font:10px monospace; pointer-events:none; border-radius:4px; display:none;">
    <div style="font-weight:bold; margin-bottom:4px;">BONE MONITOR</div>
    <div id="bone-list"></div>
  </div>
  <div id="anim-hud" style="position:absolute; bottom:10px; left:10px; padding:8px 12px; background:rgba(0,0,0,0.7); color:#fff; font:12px monospace; pointer-events:none; border-radius:4px; display:none;">
  </div>

  <script type="module">
    import { InertializationBlend } from './js/InertializationBlend.js';

    window.onerror = (msg, url, line, col, error) => {
      document.body.setAttribute('data-status', 'error');
      document.body.setAttribute('data-error', msg);
      console.error('[CRITICAL ERROR]', msg, error);
      return false;
    };

    BABYLON.TransformNode.prototype.getTotalVertices ??= () => 0;

    const speakerEl = document.getElementById('speaker');
    const lineEl    = document.getElementById('line');
    const progEl    = document.getElementById('prog-bar');
    const loadEl    = document.getElementById('loading');

    const resolveAsset = p => (p && !p.startsWith('http')) ? '../' + p : p;

    const isTest = new URLSearchParams(location.search).has('test');
    const SHOW_HUD = new URLSearchParams(location.search).has('hud');
    if (SHOW_HUD) {
      const hudEl = document.getElementById('anim-hud');
      if (hudEl) hudEl.style.display = 'block';
    }

    const ARKIT_MAP = {
      'jawOpen': 'aa', 'mouthFunnel': 'oh', 'mouthPucker': 'ou',
      'eyeBlinkLeft': 'blinkLeft', 'eyeBlinkRight': 'blinkRight',
      'mouthSmileLeft': 'happy', 'mouthSmileRight': 'happy'
    };

    const FINGER_BONE_RE = /thumb|index|middle|ring|little|metacarpal|finger/i;

    function evalExprChannel(ch, t) {
      const { times, weights } = ch;
      if (t <= times[0]) return weights[0];
      if (t >= times[times.length - 1]) return weights[weights.length - 1];
      for (let i = 1; i < times.length; i++) {
        if (t <= times[i]) {
          const u = (t - times[i - 1]) / (times[i] - times[i - 1]);
          return weights[i - 1] * (1 - u) + weights[i] * u;
        }
      }
      return weights[weights.length - 1];
    }

    async function loadFaceJSON(url) {
      if (!url || url.endsWith('.vrma') || url.endsWith('.vrm')) return null;
      try {
        const r = await fetch(url);
        if (!r.ok) throw new Error(`HTTP ${r.status}`);
        const data = await r.json();
        const { names, frames } = data;
        if (!names?.length || !frames?.length) return null;
        const times = frames.map(f => f.time);
        return {
          names, duration: times[times.length - 1] ?? 0,
          channels: names.map((name, i) => ({
            name, times, weights: frames.map(f => f.weights[i] ?? 0)
          })),
          startT: null
        };
      } catch (e) { return null; }
    }

    // ── Load resources in parallel ─────────────────────────────────────────────
    const [, sceneData] = await Promise.all([
      new Promise((res, rej) => {
        window.LOADERS = BABYLON;
        const s = document.createElement('script');
        s.src = 'https://xuhuisheng.github.io/babylonjs-vrm/babylon-vrm-loader.js';
        s.onload = () => {
          const s2 = document.createElement('script');
          s2.src = 'vrm1-loader.js';
          s2.onload = res;
          s2.onerror = () => { console.warn('[scene] vrm1-loader missing'); res(); };
          document.head.appendChild(s2);
        };
        s.onerror = rej;
        document.head.appendChild(s);
      }),
      fetch('traffic_scene.json').then(r => r.json()),
    ]);

    // ── Babylon scene ──────────────────────────────────────────────────────────
    const canvas = document.getElementById('renderCanvas');
    const engine = new BABYLON.Engine(canvas, true);
    const scene  = new BABYLON.Scene(engine);

    scene.ambientColor = new BABYLON.Color3(.05, .05, .1);
    scene.clearColor   = new BABYLON.Color4(.04, .04, .08, 1);

    const key = new BABYLON.DirectionalLight('key', new BABYLON.Vector3(.3, -1, .5), scene);
    key.intensity = 1.2;
    key.diffuse   = new BABYLON.Color3(1, .95, .85);
    const fill = new BABYLON.HemisphericLight('fill', new BABYLON.Vector3(0, 1, 0), scene);
    fill.intensity = .35;
    fill.diffuse   = new BABYLON.Color3(.6, .7, 1);
    fill.groundColor = new BABYLON.Color3(.05, .04, .08);

    const camera = new BABYLON.ArcRotateCamera('cam',
      Math.PI / 2, Math.PI / 2 - 0.22, 4.2,
      new BABYLON.Vector3(0, 1.05, 0), scene);
    camera.attachControl(canvas, true);
    camera.lowerRadiusLimit = 1; camera.upperRadiusLimit = 12;

    // ── Actor loader ───────────────────────────────────────────────────────────
    const actors = {};

    async function loadActor(actorDef) {
      const { id, vrm, startPosition } = actorDef;
      loadEl.textContent = `Loading ${id}&hellip;`;
      const preMgrCount = scene.metadata?.vrmManagers?.length ?? 0;
      const preRootIds  = new Set(scene.rootNodes.map(n => n.uniqueId));

      const vrmUrl = vrm.startsWith('http') ? vrm :
        vrm.startsWith('models/') ? '../' + vrm : vrm;
      await BABYLON.ImportMeshAsync(vrmUrl, scene);

      const mgr = (scene.metadata?.vrmManagers ?? [])
        .slice(preMgrCount).find(m => m.isVRM1)
        ?? scene.metadata?.vrmManagers?.[preMgrCount];
      const root = scene.rootNodes.find(n => !preRootIds.has(n.uniqueId));
      if (!mgr || !root) { console.error('[scene] Load failed for', id); return; }

      // Create box parent for root motion
      const box = new BABYLON.TransformNode(`box-${id}`, scene);
      root.setParent(box);
      box.position.set(startPosition?.x ?? 0, startPosition?.y ?? 0, startPosition?.z ?? 0);

      // Build morph target map
      const morphMap = new Map();
      const normalize = s => s.toLowerCase().replace(/[^a-z0-9]/g, '');
      for (const mesh of root.getChildMeshes(false)) {
        const mtm = mesh.morphTargetManager;
        if (!mtm) continue;
        for (let i = 0; i < mtm.numTargets; i++) {
          const mt = mtm.getTarget(i);
          if (!mt.name) continue;
          morphMap.set(mt.name.toLowerCase(), mt);
          morphMap.set(normalize(mt.name), mt);
          mt.name.split(/[._]/).forEach(p => {
            if (p) { morphMap.set(p.toLowerCase(), mt); morphMap.set(normalize(p), mt); }
          });
        }
      }

      // AnimatorAvatar for retargetAnimationGroup
      const vrmAvatar = new BABYLON.AnimatorAvatar(`avatar-${id}`, root);
      const blender = new InertializationBlend(scene);

      const idleClipName = actorDef.idleClip ? actorDef.idleClip.replace(/^.*[/\\]|\.vrma$/g, '') : null;
      actors[id] = { id, mgr, root, box, morphMap, vrmAvatar, blender, faceAnim: null, _bodyGroup: null, _prevClip: null, _idleGroup: null, _idleClipName: idleClipName };
    }

    window.__scene = scene;
    window.__actors = actors;

    // ── VRMA loader (retargetAnimationGroup with pre-load state preservation) ──
    async function loadVRMA(actor, url, name) {
      actor._loading = true;

      // Save current bone state before the load (babylon-vrm-loader corrupts bones)
      const pre = {};
      for (const [key, node] of Object.entries(actor.mgr.humanoidBone)) {
        if (key === 'nodeMap') continue;
        if (!node) continue;
        pre[key] = {
          rotationQuaternion: node.rotationQuaternion ? node.rotationQuaternion.clone() : null,
          position: node.position.clone(),
        };
      }

      let container;
      try { container = await BABYLON.LoadAssetContainerAsync(url, scene); }
      catch (e) { return null; }

      const srcGroup = container.animationGroups[0];
      const animMgr = (scene.metadata?._vrmAnimations ?? []).at(-1);

      if (!animMgr?.animationMap || !srcGroup) {
        container.dispose();
        return null;
      }

      // Build mapNodeNames from temp nodes → VRM bone names
      const mapNodeNames = new Map();
      srcGroup.targetedAnimations.forEach((ta, i) => {
        const boneName = animMgr.animationMap.get(i);
        const bone = actor.mgr.humanoidBone[boneName];
        if (bone && ta.target?.name) mapNodeNames.set(ta.target.name, bone.name);
      });

      // Restore pre-load bone state (undo the loader's frame-0 evaluation)
      for (const [key, node] of Object.entries(actor.mgr.humanoidBone)) {
        if (key === 'nodeMap') continue;
        const saved = pre[key];
        if (!saved || !node) continue;
        if (saved.rotationQuaternion && node.rotationQuaternion) node.rotationQuaternion.copyFrom(saved.rotationQuaternion);
        node.position.copyFrom(saved.position);
      }

      actor._loading = false;

      const remapped = actor.vrmAvatar.retargetAnimationGroup(srcGroup, {
        animationGroupName: `${actor.id}-${name}`,
        fixAnimations: false,
        fixRootPosition: true,
        rootNodeName: actor.mgr.humanoidBone['hips']?.name,
        groundReferenceNodeName: actor.mgr.humanoidBone['leftFoot']?.name,
        mapNodeNames,
      });

      container.dispose();
      return remapped;
    }

    // ── Face animation ─────────────────────────────────────────────────────────
    function setExpression(actor, name, value) {
      const targetKey = name.toLowerCase();
      const normalizedKey = targetKey.replace(/[^a-z0-9]/g, '');
      let mt = actor.morphMap.get(targetKey) || actor.morphMap.get(normalizedKey);
      if (!mt) {
        const mapped = ARKIT_MAP[name];
        if (mapped) {
          const mk = mapped.toLowerCase();
          mt = actor.morphMap.get(mk) || actor.morphMap.get(mk.replace(/[^a-z0-9]/g, ''));
        }
      }
      if (mt) mt.influence = value;
    }

    const boneListEl = document.getElementById('bone-list');
    const diagEl = document.getElementById('diagnostics');
    const TRACKED_BONES_DEFAULT = ['spine', 'chest', 'upperChest', 'neck', 'leftUpperArm', 'rightUpperArm'];
    let TRACKED_BONES = [...TRACKED_BONES_DEFAULT];

    // ── Render-loop evaluation (Face, Diagnostics) ─────────────────────────────
    scene.onAfterRenderObservable.add(() => {
      const now = performance.now() / 1000;
      const dt = engine.getDeltaTime() / 1000;
      let diagHtml = '';

      for (const actor of Object.values(actors)) {
        // Face animation (can stay here or move, but it's fine here)
        const fa = actor.faceAnim;
        if (fa?.startT) {
          const t = now - fa.startT;
          if (t > fa.duration + 0.1) {
            for (const ch of fa.channels) setExpression(actor, ch.name, 0);
            actor.faceAnim = null;
          } else {
            for (const ch of fa.channels) setExpression(actor, ch.name, evalExprChannel(ch, t));
          }
        }

        // Track bone snap violations
        if (actor._loading) continue;
        actor.lastRotations ??= {};

        // Capture inertia for whatever is currently driving the bones
        if (actor._bodyGroup?.isPlaying) actor.blender.captureInertia(actor._bodyGroup);
        else if (actor._idleGroup?.isPlaying && actor._idleGroup.weight > 0) actor.blender.captureInertia(actor._idleGroup);

        // Skip detection for first 3 frames after clip transitions (snap to new pose is expected)
        if (actor._skipFrames > 0) {
          actor._skipFrames--;
          // Just update baseline
          for (const boneName of TRACKED_BONES) {
            const bone = actor.mgr.humanoidBone[boneName];
            if (!bone) continue;
            const q = bone.rotationQuaternion || BABYLON.Quaternion.FromEulerAngles(bone.rotation.x, bone.rotation.y, bone.rotation.z);
            actor.lastRotations[boneName] = q.clone();
          }
          continue;
        }

        const SNAP_DETECTION_THRESHOLD = 10.0;
        actor.physicalViolations ??= [];
        let anyPlaying = false;

        for (const boneName of TRACKED_BONES) {
          const bone = actor.mgr.humanoidBone[boneName];
          if (!bone) continue;
          const q = bone.rotationQuaternion || BABYLON.Quaternion.FromEulerAngles(bone.rotation.x, bone.rotation.y, bone.rotation.z);
          if (actor.lastRotations[boneName]) {
            const lastQ = actor.lastRotations[boneName];
            const dot = Math.abs(lastQ.x * q.x + lastQ.y * q.y + lastQ.z * q.z + lastQ.w * q.w);
            const angle = 2 * Math.acos(Math.min(1, dot)) * (180 / Math.PI);
            if (angle > SNAP_DETECTION_THRESHOLD) {
              actor.physicalViolations.push({ type: 'snap', bone: boneName, angle: +angle.toFixed(2), time: now });
            }
          }
          actor.lastRotations[boneName] = q.clone();

          // Show bone rotation in diag if any group is playing
          if (actor._bodyGroup?.isPlaying || actor._idleGroup?.isPlaying) {
            anyPlaying = true;
            if (diagHtml === '' || !diagHtml.includes(`underline;">Actor: ${actor.id}</div>`)) {
              diagHtml += `<div style="color:#fff; text-decoration:underline;">Actor: ${actor.id}</div>`;
            }
            const euler = q.toEulerAngles();
            const deg = euler.scale(180 / Math.PI);
            diagHtml += `<div>${boneName.padEnd(14)}: ${deg.x.toFixed(1)}, ${deg.y.toFixed(1)}, ${deg.z.toFixed(1)}</div>`;
          }
        }

        if (anyPlaying) {
          if (actor.physicalViolations.length > 0) diagHtml += `<div style="color:#f00;">Violations: ${actor.physicalViolations.length}</div>`;
          diagHtml += '<br/>';
        }
      }

      if (diagHtml) {
        diagEl.style.display = 'block';
        boneListEl.innerHTML = diagHtml;
      } else {
        diagEl.style.display = 'none';
      }

      if (SHOW_HUD) {
        const hudEl = document.getElementById('anim-hud');
        if (hudEl) {
          hudEl.style.display = 'block';
          let html = '';
          for (const actor of Object.values(actors)) {
            const name = actor.id || '?';
            const isBody = actor._bodyGroup?.isPlaying;
            const isIdle = actor._idleGroup?.isPlaying;
            if (isBody) {
              html += `<div><b>${name}</b> &rarr; <span style="color:#8cf">gesture</span></div>`;
            } else if (isIdle) {
              html += `<div><b>${name}</b> <span style="color:#6a6">idle</span></div>`;
            } else {
              html += `<div><b>${name}</b> <span style="color:#666">stopped</span></div>`;
            }
          }
          hudEl.innerHTML = html;
        }
      }
    });

    // Sync diagnostic lastRotations to current bone state (prevents snapping detection
    // from babylon-vrm-loader corruption between pre-load save and restore)
    function syncRotations(actor) {
      if (!actor.lastRotations) actor.lastRotations = {};
      const bones = actor.mgr?.humanoidBone;
      if (!bones) return;
      for (const boneName of TRACKED_BONES) {
        const bone = bones[boneName];
        if (!bone) continue;
        const q = bone.rotationQuaternion || BABYLON.Quaternion.FromEulerAngles(bone.rotation.x, bone.rotation.y, bone.rotation.z);
        actor.lastRotations[boneName] = q.clone();
      }
    }

    // ── Timeline event player ──────────────────────────────────────────────────
    function sleep(ms) { return new Promise(r => setTimeout(r, ms)); }

    async function playVRMA(group) {
      const frameCount = (group.to - group.from) || 0;
      const duration = frameCount / 60 / (group.speedRatio || 1);
      if (duration <= 0) return;
      group.start(false, 1.0, group.from, group.to, false);
      await sleep(duration * 1000);
    }

    async function playEvent(event) {
      const actor = actors[event.actor];
      if (!actor) return;

      speakerEl.textContent = event.actor.toUpperCase();
      lineEl.textContent    = event.description ?? '';

      // Mute idle for speaking actor (keeps running at weight 0, no restart snap)
      if (actor._idleGroup) {
        actor._idleGroup.weight = 0;
      }

      // Set box position/rotation
      if (event.boxPosition) {
        actor.box.position.set(event.boxPosition.x, event.boxPosition.y, event.boxPosition.z);
      }
      if (event.boxRotation) {
        const r = event.boxRotation;
        actor.box.rotationQuaternion = BABYLON.Quaternion.FromEulerAngles(
          r.x * Math.PI/180, r.y * Math.PI/180, r.z * Math.PI/180
        );
      }

      // Stop previous body animation
      if (actor._bodyGroup) {
        actor._bodyGroup.stop();
        actor._bodyGroup.dispose();
        actor._bodyGroup = null;
      }

      // Load and play body clip
      const clipURL = resolveAsset(event.clip);
      const bodyGroup = await loadVRMA(actor, clipURL, 'body');
      if (bodyGroup) {
        // Reset baseline after load
        syncRotations(actor);
        bodyGroup.speedRatio = event.speed || 1.0;

        // Smooth transition from current pose (idle) to gesture start
        actor.blender.startTransition(bodyGroup, 0, 0.1, 0.25);

        bodyGroup.start(false, 1.0, bodyGroup.from, bodyGroup.to, false);
        actor._bodyGroup = bodyGroup;
        actor._prevClip = event.clip;
        actor._skipFrames = 3;
      }

      // Load face data
      const faceURL = resolveAsset(event.lipSync || event.layers?.FACE);
      const fa = await loadFaceJSON(faceURL);
      if (fa) {
        fa.startT = performance.now() / 1000;
        actor.faceAnim = fa;
      }

      // Wait for event duration
      const maxDur = parseFloat(new URLSearchParams(location.search).get('maxdur')) || 0;
      const dur = maxDur > 0 ? maxDur : (event.duration ?? 4);
      const start = performance.now();
      await new Promise(resolve => {
        const timer = setInterval(() => {
          const elapsed = (performance.now() - start) / 1000;
          progEl.style.width = (Math.min(elapsed / dur, 1) * 100).toFixed(1) + '%';
          if (elapsed >= dur) {
            clearInterval(timer);
            resolve();
          }
        }, 16);
      });

      // Stop body clip and resume idle naturally (weight 1 — idle never stopped, no snap)
      if (actor._bodyGroup) {
        actor._bodyGroup.stop();
        actor._bodyGroup.dispose();
        actor._bodyGroup = null;
      }

      if (actor._idleGroup) {
        // Smooth transition from gesture end back to idle
        const curFrame = actor._idleGroup.animatables[0]?.masterFrame ?? 0;
        actor.blender.startTransition(actor._idleGroup, Math.floor(curFrame), 0.1, 0.25);
        actor._idleGroup.weight = 1;
        actor._skipFrames = 3;
      }

      progEl.style.width = '0%';
    }

    async function runScene() {
      const timeline = sceneData.timeline ?? [];
      for (let i = 0; i < timeline.length; i++) {
        await playEvent(timeline[i]);
        await sleep(400);
      }
      speakerEl.textContent = '';
      lineEl.textContent    = '&mdash; end &mdash;';

      if (isTest) {
        const allViolations = Object.values(actors).flatMap(a => a.physicalViolations || []);
        window.__TEST_DATA = {
          completed: true,
          physicalViolations: allViolations,
          maxSnapDeg: allViolations.length > 0 ? Math.max(...allViolations.map(v => v.angle)) : 0,
          violationCount: allViolations.length,
        };
        document.body.setAttribute('data-status', 'complete');
      }
    }

    // ── Load actors ────────────────────────────────────────────────────────────
    for (const actorDef of (sceneData.actors ?? [])) {
      await loadActor(actorDef);
    }

    // Start idle loops for all actors (plays while other actor speaks)
    for (const actor of Object.values(actors)) {
      if (actor._idleClipName) {
        const idleUrl = resolveAsset(`vrma/${actor._idleClipName}.vrma`);
        const idleGroup = await loadVRMA(actor, idleUrl, `${actor.id}-idle`);
        if (idleGroup) {
          idleGroup.start(false, 1.0, idleGroup.from, idleGroup.to, true);
          actor._idleGroup = idleGroup;
          actor._skipFrames = 3;
        }
      }
    }

    // Build tracked bones from all loaded actors
    const allKeys = new Set();
    for (const actor of Object.values(actors)) {
      if (!actor.mgr?.humanoidBone) continue;
      for (const key of Object.keys(actor.mgr.humanoidBone)) {
        if (key === 'nodeMap' || FINGER_BONE_RE.test(key)) continue;
        allKeys.add(key);
      }
    }
    if (allKeys.size > 0) TRACKED_BONES = [...allKeys];

    // ── Start ──────────────────────────────────────────────────────────────────
    if (isTest) {
      loadEl.style.display = 'none';
      engine.runRenderLoop(() => { scene.render(); });
      window.addEventListener('resize', () => engine.resize());
      runScene();
    } else {
      loadEl.style.display = 'none';
      if (SHOW_HUD) {
        engine.runRenderLoop(() => { scene.render(); });
        window.addEventListener('resize', () => engine.resize());
        runScene();
      } else {
        lineEl.textContent   = 'Click to begin';
        speakerEl.textContent = '';
        await new Promise(resolve => canvas.addEventListener('click', resolve, { once: true }));
        lineEl.textContent = '';
        engine.runRenderLoop(() => { scene.render(); });
        window.addEventListener('resize', () => engine.resize());
        runScene();
      }
    }
  </script>
</body>
</html>
